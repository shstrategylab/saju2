<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사주궁합 — 관리자</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --border: #e5dfd0;
    --text: #1a1208;
    --text-muted: #7a6a52;
    --gold: #b8860b;
    --gold-bg: #fdf8ee;
    --gold-border: rgba(184,134,11,0.3);
    --accent: #b8860b;
    --success: #15803d;
    --success-bg: #f0fdf4;
    --warning: #b45309;
    --warning-bg: #fffbeb;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --blue: #1d4ed8;
    --blue-bg: #eff6ff;
    --blue-border: rgba(29,78,216,0.2);
    --pink: #be185d;
    --pink-bg: #fdf2f8;
    --pink-border: rgba(190,24,93,0.2);
    --radius: 10px;
    --radius-sm: 6px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', -apple-system, sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── 로그인 화면 ── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: var(--bg);
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 100%; max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  }
  .login-emblem {
    text-align: center; margin-bottom: 1.75rem;
  }
  .login-emblem svg { width: 52px; height: 52px; }
  .login-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px; font-weight: 600;
    color: var(--text); text-align: center;
    margin-bottom: 4px;
  }
  .login-sub {
    font-size: 12px; color: var(--text-muted);
    text-align: center; margin-bottom: 1.75rem;
  }
  .login-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .login-field label { font-size: 12px; color: var(--text-muted); }
  .login-field input {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px; color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 13px;
    width: 100%; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .login-field input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,134,11,0.1);
  }
  .login-btn {
    width: 100%; padding: 12px;
    font-family: 'Noto Serif KR', serif;
    font-size: 15px; font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #7b5e00 0%, var(--gold) 100%);
    border: none; border-radius: var(--radius-sm);
    cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s;
  }
  .login-btn:hover { opacity: 0.88; }
  .login-btn:disabled { opacity: 0.5; cursor: default; }
  .login-error {
    font-size: 12px; color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid rgba(220,38,38,0.2);
    border-radius: var(--radius-sm);
    padding: 8px 12px; margin-top: 10px;
    display: none;
  }
  .login-error.show { display: block; }

  /* ── 앱 화면 ── */
  #app-screen { display: none; }

  /* TOP BAR */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .topbar-title { font-size: 15px; font-weight: 700; font-family: 'Noto Serif KR', serif; color: var(--gold); }
  .topbar-sub { font-size: 12px; color: var(--text-muted); margin-left: 10px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .user-info { font-size: 12px; color: var(--text-muted); }

  /* LAYOUT */
  .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 56px); }

  /* LIST PANEL */
  .list-panel { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; }
  .list-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 10; }
  .list-header span { font-size: 13px; font-weight: 600; }
  .count-badge { background: var(--gold-bg); color: var(--gold); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--gold-border); }

  .filter-bar { padding: 10px 1.25rem; border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { font-size: 11px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; background: var(--bg); color: var(--text-muted); transition: all 0.15s; }
  .filter-btn.active { background: var(--gold-bg); color: var(--gold); border-color: var(--gold); }

  .search-bar { padding: 8px 1.25rem; border-bottom: 1px solid var(--border); }
  .search-bar input { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; }
  .search-bar input:focus { border-color: var(--gold); }

  .app-item { padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .app-item:hover { background: var(--bg); }
  .app-item.selected { background: var(--gold-bg); border-left: 3px solid var(--gold); }
  .app-item-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .app-item-meta { font-size: 12px; color: var(--text-muted); }
  .couple-label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .heart-sep { color: var(--pink); font-size: 13px; }

  .status-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .s-접수완료 { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); }
  .s-분석중   { background: var(--warning-bg); color: var(--warning); }
  .s-완료     { background: var(--success-bg); color: var(--success); }
  .empty-list { padding: 3rem 1.25rem; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* DETAIL PANEL */
  .detail-panel { overflow-y: auto; padding: 1.5rem 2rem; }
  .detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 14px; flex-direction: column; gap: 0.5rem; }
  .detail-empty span { font-size: 2rem; }

  .detail-topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .detail-names { font-size: 1.15rem; font-weight: 700; font-family: 'Noto Serif KR', serif; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .detail-heart { color: var(--pink); }
  .detail-sub { font-size: 13px; color: var(--text-muted); }
  .detail-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 16px; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .btn:hover { background: var(--bg); }
  .btn-accent  { background: var(--gold); color: #fff; border-color: var(--gold); }
  .btn-accent:hover { opacity: 0.88; }
  .btn-success { background: var(--success-bg); color: var(--success); border-color: var(--success); }
  .btn-danger  { background: var(--danger-bg);  color: var(--danger);  border-color: var(--danger); }

  .status-select { font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; }

  .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 1.25rem 0 0.6rem; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .persons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }

  .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.25rem; }
  .info-card.full { grid-column: 1 / -1; }
  .info-card.person-a { border-top: 3px solid var(--blue); }
  .info-card.person-b { border-top: 3px solid var(--pink); }
  .info-card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.75rem; font-family: 'Noto Serif KR', serif; }
  .info-card.person-a .info-card-title { color: var(--blue); }
  .info-card.person-b .info-card-title { color: var(--pink); }
  .info-card .info-card-title.gold { color: var(--gold); }

  .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .info-row .k { color: var(--text-muted); flex-shrink: 0; }
  .info-row .v { font-weight: 500; max-width: 190px; text-align: right; word-break: break-all; }

  .items-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .item-tag { font-size: 11px; padding: 3px 9px; background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); border-radius: 20px; }
  .question-box { font-size: 14px; line-height: 1.8; color: var(--text); background: var(--warning-bg); border-left: 3px solid #f59e0b; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 14px; white-space: pre-wrap; }
  .empty-box { font-size: 13px; color: var(--text-muted); }

  .json-preview { background: #1e1e2e; border-radius: var(--radius); padding: 1rem 1.25rem; font-size: 12px; font-family: 'Courier New', monospace; color: #cdd6f4; line-height: 1.7; max-height: 300px; overflow-y: auto; white-space: pre; margin-top: 0.75rem; }

  .memo-area { width: 100%; padding: 10px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.7; }
  .memo-area:focus { outline: none; border-color: var(--gold); }

  .loading { padding: 2rem; text-align: center; color: var(--text-muted); }

  .person-tag-a { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .person-tag-b { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: var(--pink-bg); color: var(--pink); border: 1px solid var(--pink-border); border-radius: 4px; padding: 1px 6px; font-weight: 600; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .list-panel { height: auto; max-height: 40vh; }
    .info-grid, .persons-grid { grid-template-columns: 1fr; }
    .info-card.person-a, .info-card.person-b { grid-column: auto; }
  }
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-emblem">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="34" stroke="#b8922a" stroke-width="0.75" opacity="0.4"/>
        <circle cx="36" cy="36" r="26" stroke="#b8922a" stroke-width="0.5" opacity="0.25"/>
        <path d="M36 10 A26 26 0 0 1 36 62 A13 13 0 0 1 36 36 A13 13 0 0 0 36 10Z" fill="#b8922a" opacity="0.18"/>
        <path d="M36 10 A26 26 0 0 0 36 62 A13 13 0 0 0 36 36 A13 13 0 0 1 36 10Z" fill="#534AB7" opacity="0.15"/>
        <circle cx="36" cy="23" r="4" fill="#b8922a" opacity="0.5"/>
        <circle cx="36" cy="49" r="4" fill="#534AB7" opacity="0.5"/>
        <line x1="36" y1="4" x2="36" y2="9" stroke="#b8922a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <line x1="36" y1="63" x2="36" y2="68" stroke="#b8922a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <line x1="4" y1="36" x2="9" y2="36" stroke="#b8922a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <line x1="63" y1="36" x2="68" y2="36" stroke="#b8922a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>
    <div class="login-title">관리자 로그인</div>
    <div class="login-sub">사주궁합 연구소 접수 관리 시스템</div>

    <div class="login-field">
      <label>이메일</label>
      <input type="email" id="login-email" placeholder="admin@example.com" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <div class="login-field">
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>

    <div class="login-error" id="login-error"></div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- ── 관리자 앱 화면 ── -->
<div id="app-screen">

  <div class="topbar">
    <div style="display:flex; align-items:center;">
      <div class="topbar-title">사주궁합 연구소</div>
      <span class="topbar-sub">접수 관리</span>
    </div>
    <div class="topbar-right">
      <span class="user-info" id="user-email"></span>
      <button class="btn" onclick="loadApplications()">🔄 새로고침</button>
      <button class="btn btn-accent" onclick="downloadAllJson()">전체 JSON 다운로드</button>
      <button class="btn btn-danger" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="layout">
    <div class="list-panel">
      <div class="list-header">
        <span>접수 목록</span>
        <span class="count-badge" id="countBadge">0</span>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterBy('전체', this)">전체</button>
        <button class="filter-btn" onclick="filterBy('접수완료', this)">접수완료</button>
        <button class="filter-btn" onclick="filterBy('분석중', this)">분석중</button>
        <button class="filter-btn" onclick="filterBy('완료', this)">완료</button>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="연락처, 접수번호 검색..." oninput="renderList()">
      </div>
      <div id="appList"><div class="loading">불러오는 중...</div></div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-empty">
        <span>💑</span>
        왼쪽 목록에서 접수 건을 선택하세요
      </div>
    </div>
  </div>

</div><!-- /app-screen -->

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA_zERfcr5taongC9kShz8Si9-yCqng19o",
  authDomain: "saju-compatibility.firebaseapp.com",
  databaseURL: "https://saju-compatibility-default-rtdb.firebaseio.com",
  projectId: "saju-compatibility",
  storageBucket: "saju-compatibility.firebasestorage.app",
  messagingSenderId: "754455593422",
  appId: "1:754455593422:web:81fd18691cbaadfda72b9f"
};

firebase.initializeApp(firebaseConfig);
const db   = firebase.database();
const auth = firebase.auth();

// ── 인증 상태 감지 ──
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display   = 'block';
    document.getElementById('user-email').textContent = user.email;
    loadApplications();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display   = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');

  if (!email || !pw) {
    errEl.textContent = '이메일과 비밀번호를 입력해 주세요.';
    errEl.classList.add('show'); return;
  }

  btn.disabled = true; btn.textContent = '로그인 중...';
  errEl.classList.remove('show');

  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch(e) {
    const msgs = {
      'auth/user-not-found':  '등록되지 않은 이메일입니다.',
      'auth/wrong-password':  '비밀번호가 올바르지 않습니다.',
      'auth/invalid-email':   '이메일 형식이 올바르지 않습니다.',
      'auth/too-many-requests': '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.',
    };
    errEl.textContent = msgs[e.code] || '로그인에 실패했습니다. (' + e.code + ')';
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = '로그인';
  }
}

async function doLogout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  await auth.signOut();
}

// ── 데이터 ──
let allApps = [];
let currentFilter = '전체';
let selectedId = null;

async function loadApplications() {
  document.getElementById('appList').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const snap = await db.ref('saju_applications').get();
    if (!snap.exists()) {
      allApps = [];
    } else {
      const raw = snap.val();
      allApps = Object.entries(raw).map(([key, val]) => ({ id: key, ...val }));
      allApps.sort((a, b) => {
        const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return tb - ta;
      });
    }
    renderList();
  } catch (e) {
    document.getElementById('appList').innerHTML = `<div class="loading" style="color:#dc2626;">오류: ${e.message}</div>`;
  }
}

function renderList() {
  const keyword = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  let filtered = currentFilter === '전체' ? allApps : allApps.filter(a => (a.status || '접수완료') === currentFilter);
  if (keyword) {
    filtered = filtered.filter(a =>
      (a.contact || '').toLowerCase().includes(keyword) ||
      (a.ref || '').toLowerCase().includes(keyword) ||
      (a.male?.birthdate || '').toLowerCase().includes(keyword) ||
      (a.female?.birthdate || '').toLowerCase().includes(keyword)
    );
  }
  document.getElementById('countBadge').textContent = filtered.length;
  const el = document.getElementById('appList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-list">접수 건이 없습니다.</div>';
    return;
  }
  el.innerHTML = filtered.map(app => {
    const status  = app.status || '접수완료';
    const dateStr = app.createdAt
      ? new Date(app.createdAt).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
      : '';
    const maleBirth   = app.male?.birthdate   || '생년월일 미입력';
    const femaleBirth = app.female?.birthdate || '생년월일 미입력';
    return `
      <div class="app-item ${selectedId === app.id ? 'selected' : ''}" onclick="selectApp('${app.id}')">
        <div class="app-item-name">
          <div class="couple-label">
            <span>♂ ${escHtml(maleBirth)}</span>
            <span class="heart-sep">♥</span>
            <span>♀ ${escHtml(femaleBirth)}</span>
          </div>
          <span class="status-badge s-${status}">${status}</span>
        </div>
        <div class="app-item-meta">${escHtml(app.contact || '—')} · ${dateStr}</div>
      </div>`;
  }).join('');
}

function filterBy(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function selectApp(id) {
  selectedId = id;
  renderList();
  const app = allApps.find(a => a.id === id);
  if (app) renderDetail(app);
}

function renderDetail(app) {
  const status      = app.status || '접수완료';
  const submittedAt = app.createdAt ? new Date(app.createdAt).toLocaleString('ko-KR') : '—';
  const maleBirthdate  = app.male?.birthdate  || '—';
  const maleBirthtime  = app.male?.birthtime  || '—';
  const maleBirthplace = app.male?.birthplace || '—';
  const femaleBirthdate  = app.female?.birthdate  || '—';
  const femaleBirthtime  = app.female?.birthtime  || '—';
  const femaleBirthplace = app.female?.birthplace || '—';
  const itemsHtml = (app.topics && app.topics.length > 0)
    ? `<div class="items-list">${app.topics.map(i => `<span class="item-tag">${escHtml(i)}</span>`).join('')}</div>`
    : '<span class="empty-box">(없음)</span>';

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-topbar">
      <div>
        <div class="detail-names">
          <span class="person-tag-a">♂ 남성</span>
          ${escHtml(maleBirthdate)}
          <span class="detail-heart">♥</span>
          <span class="person-tag-b">♀ 여성</span>
          ${escHtml(femaleBirthdate)}
        </div>
        <div class="detail-sub">접수: ${submittedAt} &nbsp;·&nbsp; 접수번호: ${escHtml(app.ref || app.id)}</div>
      </div>
      <div class="detail-actions">
        <select class="status-select" onchange="updateStatus('${app.id}', this.value)">
          <option ${status==='접수완료'?'selected':''}>접수완료</option>
          <option ${status==='분석중'?'selected':''}>분석중</option>
          <option ${status==='완료'?'selected':''}>완료</option>
        </select>
        <button class="btn btn-success" onclick="downloadJson('${app.id}')">📥 JSON</button>
        <button class="btn btn-danger"  onclick="deleteApp('${app.id}')">삭제</button>
      </div>
    </div>

    <div class="section-title">사주 정보</div>
    <div class="persons-grid">
      <div class="info-card person-a">
        <div class="info-card-title">♂ 남성</div>
        <div class="info-row"><span class="k">생년월일</span><span class="v">${escHtml(maleBirthdate)}</span></div>
        <div class="info-row"><span class="k">출생 시각</span><span class="v">${escHtml(maleBirthtime)}</span></div>
        <div class="info-row"><span class="k">출생지</span><span class="v">${escHtml(maleBirthplace)}</span></div>
      </div>
      <div class="info-card person-b">
        <div class="info-card-title">♀ 여성</div>
        <div class="info-row"><span class="k">생년월일</span><span class="v">${escHtml(femaleBirthdate)}</span></div>
        <div class="info-row"><span class="k">출생 시각</span><span class="v">${escHtml(femaleBirthtime)}</span></div>
        <div class="info-row"><span class="k">출생지</span><span class="v">${escHtml(femaleBirthplace)}</span></div>
      </div>
    </div>

    <div class="section-title">접수 정보</div>
    <div class="info-grid">
      <div class="info-card full">
        <div class="info-card-title gold">연락처 &amp; 접수</div>
        <div class="info-row"><span class="k">연락처 / 이메일</span><span class="v">${escHtml(app.contact || '—')}</span></div>
        <div class="info-row"><span class="k">접수번호</span><span class="v" style="font-size:11px;">${escHtml(app.ref || app.id)}</span></div>
        <div class="info-row"><span class="k">접수일시</span><span class="v">${submittedAt}</span></div>
        <div class="info-row"><span class="k">상태</span><span class="v"><span class="status-badge s-${status}">${status}</span></span></div>
      </div>
      <div class="info-card full">
        <div class="info-card-title gold">풀이 요청 항목</div>
        ${itemsHtml}
      </div>
      <div class="info-card full">
        <div class="info-card-title gold">의뢰 내용 / 추가 전달 사항</div>
        ${app.memo ? `<div class="question-box">${escHtml(app.memo)}</div>` : '<div class="empty-box">(없음)</div>'}
      </div>
    </div>

    <div class="section-title">운영자 메모</div>
    <div class="info-grid">
      <div class="info-card full">
        <div class="info-card-title gold">메모</div>
        <textarea class="memo-area" id="memo_${app.id}" placeholder="궁합 분석 메모, 진행 상황 등을 기록하세요...">${escHtml(app.adminMemo || '')}</textarea>
        <div style="margin-top:8px; text-align:right;">
          <button class="btn btn-accent" onclick="saveMemo('${app.id}')">메모 저장</button>
        </div>
      </div>
      <div class="info-card full">
        <div class="info-card-title gold" style="display:flex; justify-content:space-between; align-items:center;">
          JSON 미리보기
          <button class="btn btn-success" onclick="downloadJson('${app.id}')">📥 JSON 다운로드 (Claude에 첨부)</button>
        </div>
        <div class="json-preview">${escHtml(JSON.stringify(app, null, 2))}</div>
      </div>
    </div>
  `;
}

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function updateStatus(id, status) {
  try {
    await db.ref(`saju_applications/${id}/status`).set(status);
    const app = allApps.find(a => a.id === id);
    if (app) { app.status = status; renderList(); }
  } catch(e) { alert('상태 변경 실패: ' + e.message); }
}

async function saveMemo(id) {
  const memo = document.getElementById(`memo_${id}`)?.value || '';
  try {
    await db.ref(`saju_applications/${id}/adminMemo`).set(memo);
    const app = allApps.find(a => a.id === id);
    if (app) app.adminMemo = memo;
    alert('메모가 저장되었습니다.');
  } catch(e) { alert('메모 저장 실패: ' + e.message); }
}

function downloadJson(id) {
  const app = allApps.find(a => a.id === id);
  if (!app) return;
  const date = app.createdAt ? new Date(app.createdAt).toISOString().slice(0,10) : '';
  const ref  = app.ref || id;
  const blob = new Blob([JSON.stringify(app, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `궁합_${ref}_${date}.json`; a.click();
  URL.revokeObjectURL(url);
}

function downloadAllJson() {
  if (allApps.length === 0) { alert('다운로드할 데이터가 없습니다.'); return; }
  const date = new Date().toISOString().slice(0,10);
  const blob = new Blob([JSON.stringify(allApps, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `궁합_전체접수_${date}.json`; a.click();
  URL.revokeObjectURL(url);
}

async function deleteApp(id) {
  if (!confirm('이 접수 건을 삭제하시겠습니까? 복구할 수 없습니다.')) return;
  try {
    await db.ref(`saju_applications/${id}`).remove();
    allApps = allApps.filter(a => a.id !== id);
    selectedId = null;
    renderList();
    document.getElementById('detailPanel').innerHTML = '<div class="detail-empty"><span>🗑</span>삭제되었습니다.</div>';
  } catch(e) { alert('삭제 실패: ' + e.message); }
}
</script>
</body>
</html>
